name: Update reading feed

on:
  schedule:
    # 08:17 Vietnam time (UTC+7) every day
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch latest reading metadata
        run: python update_reading.py
      - name: Commit updated reading catalogue
        run: |
          if git diff --quiet -- reading_feed.json; then
            echo "Reading feed is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reading_feed.json
            git commit -m "Update reading feed"
            git push
          fi
